name: Google Drive sync

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simular sem gravar no banco nem no R2
        required: false
        type: boolean
        default: true
      only:
        description: ID de uma pasta de construtora ou empreendimento
        required: false
        type: string

concurrency:
  group: orcka-drive-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run dry-run sync
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'orcka-media' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          MAX_PDFS_PER_RUN: ${{ vars.MAX_PDFS_PER_RUN || '15' }}
          REBUILD_WEBHOOK_URL: ${{ secrets.REBUILD_WEBHOOK_URL }}
          ONLY_FOLDER_ID: ${{ inputs.only }}
        run: |
          if [[ -n "$ONLY_FOLDER_ID" ]]; then
            pnpm sync -- --dry-run "--only=$ONLY_FOLDER_ID"
          else
            pnpm sync -- --dry-run
          fi
      - name: Run sync
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'orcka-media' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }}
          MAX_PDFS_PER_RUN: ${{ vars.MAX_PDFS_PER_RUN || '15' }}
          REBUILD_WEBHOOK_URL: ${{ secrets.REBUILD_WEBHOOK_URL }}
          ONLY_FOLDER_ID: ${{ inputs.only }}
        run: |
          if [[ -n "$ONLY_FOLDER_ID" ]]; then
            pnpm sync -- "--only=$ONLY_FOLDER_ID"
          else
            pnpm sync
          fi
